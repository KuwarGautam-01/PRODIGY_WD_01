<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Stopwatch</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="hero-section">
        <h1>Engineered For Precision.</h1>
        <h2>Designed for focus. Built for accuracy.</h2>
    </div>

    <div class="main-content">
        <div class="clock">
            <div class="time">
                <span id="minute">00</span>
                <span>:</span>
                <span id="second">00</span>
                <span>.</span>
                <span id="millisecond">00</span>
            </div>
        </div>

        <div class="laps">
            <div class="lap-header">
                <span>Lap No.</span>
                <span>Split</span>
                <span>Total</span>
            </div>

            <ul class="lap-list"></ul>
        </div>

        <div class="controls">
            <button class="reset" disabled>Lap</button>
            <button class="play start">Start</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
