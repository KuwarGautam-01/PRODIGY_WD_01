<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital StopWatch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-content">
        <h1>STOP WATCH</h1>

        <div class="clock">
            <div class="timer">
                <div class="time">
                    <span id="minute">00</span><span>:</span><span id="second">00</span><span>.</span><span id="millisecond">00</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="play"><i class="fa-solid fa-play"></i></button>
            <button class="reset"><img class="reset-img" src="https://img.icons8.com/ios-filled/50/recurring-appointment.png" alt="recurring-appointment"/></button>
        </div>
    </div>
</body>
</html>
